# CD dev: instala backend + frontend + postgres en el AKS de dev.
#
# Idea: es MANUAL (botón Run workflow) para decidir cuándo entra código al
# clúster. Flujo de secretos: GitHub Secrets -> Key Vault (az) -> pods
# (driver CSI copia al Secret cine-secrets). Nada se escribe a mano en Azure.
#
# Pasos: entrar a Azure -> validar -> subir secrets al Vault -> preparar
# (namespace, SQL, SecretProviderClass) -> aplicar manifiestos -> apuntar
# imágenes y URLs -> esperar que todo encienda.
#
# Requiere estos secrets en el repo: AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, ACR_NAME, POSTGRES_DB, POSTGRES_USER,
# POSTGRES_PASSWORD, JWT_SECRET, SESSION_SECRET.
name: CD dev - deploy a AKS

# Se dispara solo con el botón (pide los datos de abajo).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag de imagen (sha del CI o latest)'
        required: true
        default: 'latest'
      api_url:
        description: 'API_URL del frontend (navegador -> API)'
        required: true
        default: 'http://localhost:3000/api'
      app_url:
        description: 'APP_URL del frontend'
        required: true
        default: 'http://localhost:8080'
      frontend_url:
        description: 'FRONTEND_URL del backend (CORS)'
        required: true
        default: 'http://localhost:8080'
      backend_url:
        description: 'BACKEND_URL del backend (CORS)'
        required: true
        default: 'http://localhost:3000'
      cors_origin:
        description: 'CORS_ORIGIN del backend'
        required: true
        default: 'http://localhost:8080'

# Permiso para pedir el token temporal de Azure (OIDC, sin contraseñas).
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Etapa 1: descargar el código (aquí viven k8s/ y db/init/).
      - name: 1 - Descargar código
        uses: actions/checkout@v4

      # Etapa 2: entrar a Azure con token temporal.
      - name: 2 - Entrar a Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Etapa 3: apuntar kubectl al clúster de dev.
      # Guarda la conexión en un archivo temporal que se borra al terminar.
      - name: 3 - Conectar kubectl al AKS dev
        run: az aks get-credentials -g rg-cine-dev -n aks-cine-dev --overwrite-existing

      # Etapa 4: si falta el nombre del registry, avisar en claro y parar.
      - name: 4 - Revisar secret ACR_NAME
        run: |
          if [ -z "${{ secrets.ACR_NAME }}" ]; then
            echo "Falta el secret ACR_NAME (ej. acrcinedev01). Créalo en Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Etapa 5: revisar uno por uno que los 5 secretos tengan valor.
      # Un secret vacío llegaría vacío hasta el Vault y rompería los pods.
      - name: 5 - Revisar secrets de la app
        run: |
          if [ -z "${{ secrets.POSTGRES_DB }}" ]; then
            echo "Falta el secret POSTGRES_DB."
            exit 1
          fi
          if [ -z "${{ secrets.POSTGRES_USER }}" ]; then
            echo "Falta el secret POSTGRES_USER."
            exit 1
          fi
          if [ -z "${{ secrets.POSTGRES_PASSWORD }}" ]; then
            echo "Falta el secret POSTGRES_PASSWORD."
            exit 1
          fi
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "Falta el secret JWT_SECRET."
            exit 1
          fi
          if [ -z "${{ secrets.SESSION_SECRET }}" ]; then
            echo "Falta el secret SESSION_SECRET."
            exit 1
          fi

      # Etapa 6: averiguar las direcciones del ACR y del Key Vault.
      # El Vault es el único que hay en el RG, por eso se toma el primero.
      - name: 6 - Averiguar ACR y Key Vault
        id: azure
        run: |
          LOGIN_SERVER=$(az acr show -g rg-cine-dev -n ${{ secrets.ACR_NAME }} --query loginServer -o tsv)
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "ACR: $LOGIN_SERVER"
          KV_NAME=$(az keyvault list -g rg-cine-dev --query "[0].name" -o tsv)
          echo "kv_name=$KV_NAME" >> "$GITHUB_OUTPUT"
          echo "Key Vault: $KV_NAME"

      # Etapa 7: copiar los 5 secretos de GitHub al Key Vault.
      # Así nadie escribe valores a mano en el Portal: GitHub manda.
      # OJO: Key Vault NO acepta '_' en nombres (solo A-Z, 0-9 y '-'),
      # por eso se guardan con '-' y el SecretProviderClass los mapea a '_' en K8s.
      - name: 7 - Subir secrets al Key Vault
        run: |
          az keyvault secret set --vault-name ${{ steps.azure.outputs.kv_name }} --name POSTGRES-DB --value '${{ secrets.POSTGRES_DB }}' -o none
          az keyvault secret set --vault-name ${{ steps.azure.outputs.kv_name }} --name POSTGRES-USER --value '${{ secrets.POSTGRES_USER }}' -o none
          az keyvault secret set --vault-name ${{ steps.azure.outputs.kv_name }} --name POSTGRES-PASSWORD --value '${{ secrets.POSTGRES_PASSWORD }}' -o none
          az keyvault secret set --vault-name ${{ steps.azure.outputs.kv_name }} --name JWT-SECRET --value '${{ secrets.JWT_SECRET }}' -o none
          az keyvault secret set --vault-name ${{ steps.azure.outputs.kv_name }} --name SESSION-SECRET --value '${{ secrets.SESSION_SECRET }}' -o none
          echo "5 secretos sincronizados al Vault."

      # Etapa 8: crear el namespace (carpeta lógica "cine-dev" en el clúster).
      - name: 8 - Crear namespace
        run: kubectl apply -f k8s/namespace.yaml

      # Etapa 9: subir los SQL de db/init/ como ConfigMap "postgres-init".
      # Es la única fuente de verdad: no se copian SQL a mano a ningún YAML.
      - name: 9 - Subir SQL de init
        run: |
          kubectl create configmap postgres-init -n cine-dev \
            --from-file=db/init/ \
            --dry-run=client -o yaml | kubectl apply -f -

      # Etapa 10: decirle al clúster qué traer del Vault (SecretProviderClass).
      # Debe existir ANTES que los pods que la usan.
      - name: 10 - Aplicar SecretProviderClass
        run: kubectl apply -f k8s/secret-provider.yaml

      # Etapa 11: crear/actualizar postgres, backend y frontend.
      # Al arrancar, el driver CSI copia el Vault al Secret cine-secrets.
      - name: 11 - Aplicar manifiestos
        run: kubectl apply -f k8s/postgres.yaml -f k8s/backend.yaml -f k8s/frontend.yaml

      # Etapa 12: apuntar los deployments a la imagen elegida en el botón.
      - name: 12 - Fijar imágenes del tag elegido
        run: |
          kubectl set image deployment/backend -n cine-dev backend=${{ steps.azure.outputs.login_server }}/cine-backend:${{ inputs.image_tag }}
          kubectl set image deployment/frontend -n cine-dev frontend=${{ steps.azure.outputs.login_server }}/cine-frontend:${{ inputs.image_tag }}

      # Etapa 13: decirle al frontend dónde está la API y al backend
      # qué orígenes acepta (CORS). La misma imagen sirve para todo
      # porque estos valores entran al arrancar, no al compilar.
      - name: 13 - Fijar URLs públicas
        run: |
          kubectl set env deployment/frontend -n cine-dev API_URL='${{ inputs.api_url }}' APP_URL='${{ inputs.app_url }}'
          kubectl set env deployment/backend -n cine-dev FRONTEND_URL='${{ inputs.frontend_url }}' BACKEND_URL='${{ inputs.backend_url }}' CORS_ORIGIN='${{ inputs.cors_origin }}'

      # Etapa 14: esperar a que los 3 deployments queden encendidos.
      # Tiempos cortos para iterar rápido (postgres 2 min, app 3 min).
      - name: 14 - Esperar que todo encienda
        run: |
          kubectl rollout status deployment/postgres -n cine-dev --timeout=120s
          kubectl rollout status deployment/backend -n cine-dev --timeout=180s
          kubectl rollout status deployment/frontend -n cine-dev --timeout=180s

      # Etapa 15: mostrar pods y servicios (aquí se ven las EXTERNAL-IP).
      - name: 15 - Mostrar estado final
        run: |
          kubectl get pods -n cine-dev
          kubectl get svc -n cine-dev
