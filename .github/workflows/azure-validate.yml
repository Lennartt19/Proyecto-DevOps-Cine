# Valida que GitHub Actions llega a Azure con OIDC (sin secretos de larga vida).
# Requiere repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
# Se ejecuta manual (Run workflow), en PRs que toquen este archivo o en push a main.
name: Azure access validation

on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/azure-validate.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/azure-validate.yml']

permissions:
  id-token: write # obligatorio para OIDC
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Login a Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mostrar suscripción activa
        run: az account show --query '{suscripcion:name, id:id, tenant:tenantId}' -o table

      - name: Listar resource groups (lectura)
        run: az group list --query '[].{nombre:name, region:location}' -o table

      - name: Confirmar rol de la identidad
        run: az role assignment list --assignee ${{ secrets.AZURE_CLIENT_ID }} --all --query '[].{rol:roleDefinitionName, alcance:scope}' -o table
