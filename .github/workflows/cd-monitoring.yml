# CD monitoring básico: Grafana + Prometheus + Loki en el AKS de dev.
#
# Idea en 30 segundos: es MANUAL (botón Run workflow) como el CD de la app.
# Flujo de la clave: GitHub Secret -> Key Vault (az) -> Secret nativo
# (kubectl). Flujo de la config: values de k8s/monitoring/ -> Helm/charts +
# 1 Ingress. Nada se escribe a mano en Azure ni en el clúster.
#
# Qué incluye (y qué NO):
# - SÍ: kube-prometheus-stack (Prometheus + Grafana + node-exporter +
#   kube-state-metrics, todo del chart), Loki (logs) + Promtail (los recoge),
#   Grafana bajo /grafana del mismo host de la app.
# - NO: probes externas, exporter de Postgres, métricas del Ingress,
#   dashboards propios ni reglas (se quitaron para mantenerlo básico;
#   están en el historial de git si se quieren recuperar).
# NO toca frontend/backend/postgres: crea el namespace `monitoring` aparte.
#
# Orden de las etapas: entrar a Azure -> Helm -> validar clave ->
# namespace+secret -> 2 charts -> Ingress /grafana -> esperar -> mostrar URLs.
#
# Requiere estos secrets en el repo: AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, GRAFANA_ADMIN_PASSWORD (créalo en
# Settings > Secrets and variables > Actions, mínimo 12 chars, sin comilla simple).
# Pre-requisito: el CD dev ya corrió al menos 1 vez (debe existir el
# controller ingress-nginx, que nos da el host nip.io).
name: CD monitoring - observabilidad dev

on:
  workflow_dispatch:

# Permiso para pedir el token temporal de Azure (OIDC, sin contraseñas).
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Etapa 1: descargar el código (aquí viven k8s/monitoring/ y sus values).
      - name: 1 - Descargar código
        uses: actions/checkout@v4

      # Etapa 2: entrar a Azure con token temporal.
      - name: 2 - Entrar a Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Etapa 3: instalar Helm en el runner (script oficial, con sudo).
      - name: 3 - Instalar Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 -o /tmp/gethelm.sh
          bash /tmp/gethelm.sh
          helm version

      # Etapa 4: apuntar kubectl al clúster de dev.
      - name: 4 - Conectar kubectl al AKS dev
        run: az aks get-credentials -g rg-cine-dev -n aks-cine-dev --overwrite-existing

      # Etapa 5: validar que la clave de Grafana existe y no está vacía.
      # Vacía = login imposible después; se falla en claro aquí, no al final.
      - name: 5 - Revisar secret GRAFANA_ADMIN_PASSWORD
        run: |
          if [ -z "${{ secrets.GRAFANA_ADMIN_PASSWORD }}" ]; then
            echo "Falta el secret GRAFANA_ADMIN_PASSWORD (mínimo 12 chars). Créalo en Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Etapa 6: verificar que el CD dev ya instaló el Ingress NGINX.
      # Sin controller no hay host nip.io para Grafana.
      - name: 6 - Verificar Ingress NGINX del CD dev
        run: |
          kubectl get svc -n ingress-nginx ingress-nginx-controller
          echo "Controller presente, se puede continuar."

      # Etapa 7: crear namespace + guardar la clave en Key Vault y en Secret.
      # El Vault es la fuente de verdad (GitHub manda); el Secret nativo es
      # lo que lee el chart (admin.existingSecret=grafana-admin).
      - name: 7 - Namespace y secret de Grafana
        run: |
          kubectl apply -f k8s/monitoring/namespace.yaml
          KV_NAME=$(az keyvault list -g rg-cine-dev --query "[0].name" -o tsv)
          echo "Key Vault: $KV_NAME"
          az keyvault secret set --vault-name "$KV_NAME" --name GRAFANA-ADMIN-PASSWORD --value '${{ secrets.GRAFANA_ADMIN_PASSWORD }}' -o none
          az keyvault secret show --vault-name "$KV_NAME" --name GRAFANA-ADMIN-PASSWORD -o none || (echo "No se pudo guardar en el Vault. Revisa el rol 'Key Vault Secrets Officer'."; exit 1)
          kubectl create secret generic grafana-admin -n monitoring \
            --from-literal=admin-user=admin \
            --from-literal=admin-password='${{ secrets.GRAFANA_ADMIN_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Secret grafana-admin listo."

      # Etapa 8: registrar los repos de charts (las "tiendas" de Helm).
      # - prometheus-community: kube-prometheus-stack.
      # - grafana-community: Loki vigente (el de `grafana` está deprecado, verificado 2026-09-24).
      # - grafana: Promtail (el cartero de logs).
      - name: 8 - Repos Helm
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo update

      # Etapa 9: stack principal (Prometheus + Grafana + exporters de K8s).
      # El values trae __INGRESS_HOST__ y aquí se reemplaza con sed, igual
      # que el CD dev hace con k8s/ingress.yaml. upgrade --install = idempotente.
      - name: 9 - Instalar kube-prometheus-stack
        run: |
          IP=""
          for i in $(seq 1 30); do
            IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$IP" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$IP" ]; then
            echo "El Ingress aún no tiene IP pública. Revisa: kubectl get svc -n ingress-nginx"
            exit 1
          fi
          echo "INGRESS_HOST=$IP.nip.io" >> "$GITHUB_ENV"
          echo "Host: http://$IP.nip.io"
          sed "s/__INGRESS_HOST__/$IP.nip.io/" k8s/monitoring/values-kube-prometheus-dev.yaml > /tmp/kps-values.yaml
          helm upgrade --install mon prometheus-community/kube-prometheus-stack \
            -n monitoring --create-namespace \
            -f /tmp/kps-values.yaml --wait --timeout 10m

      # Etapa 10: Loki SingleBinary (los logs) + Promtail (los recolecta).
      - name: 10 - Instalar Loki y Promtail
        run: |
          helm upgrade --install loki grafana-community/loki \
            -n monitoring --create-namespace \
            -f k8s/monitoring/values-loki-dev.yaml --wait --timeout 10m
          helm upgrade --install promtail grafana/promtail \
            -n monitoring --create-namespace \
            -f k8s/monitoring/values-promtail-dev.yaml --wait --timeout 5m

      # Etapa 11: el Ingress /grafana con el host real.
      - name: 11 - Aplicar Ingress de Grafana
        run: |
          sed "s/__INGRESS_HOST__/${{ env.INGRESS_HOST }}/" k8s/monitoring/monitoring-ingress.yaml | kubectl apply -f -
          kubectl get ingress -n monitoring

      # Etapa 12: esperar a que todo quede encendido.
      - name: 12 - Esperar que todo encienda
        run: |
          kubectl rollout status statefulset/mon-kube-prometheus-stack-prometheus -n monitoring --timeout=300s
          kubectl rollout status deployment/mon-grafana -n monitoring --timeout=300s
          kubectl rollout status statefulset/loki -n monitoring --timeout=300s
          kubectl rollout status daemonset/promtail -n monitoring --timeout=300s

      # Etapa 13: mostrar el estado final y las URLs.
      - name: 13 - Mostrar estado final
        run: |
          kubectl get pods -n monitoring
          kubectl get svc -n monitoring
          kubectl get ingress -n monitoring
          kubectl get pvc -n monitoring
          echo "Grafana: http://${{ env.INGRESS_HOST }}/grafana (admin + GRAFANA_ADMIN_PASSWORD)"
          echo "App: http://${{ env.INGRESS_HOST }}/ (verifica que el monitoreo no la rompió)"
