# ParkyFilms — despliegue LOCAL en 3 contenedores
# Uso:
#   cp .env.example .env   # solo la primera vez
#   docker compose up --build
#   Frontend: http://localhost:8080   Backend: http://localhost:3000/health
# Para detener: docker compose down   (los datos quedan en el volumen pgdata)
# Para borrar TODO incl. BD: docker compose down -v
name: ${COMPOSE_PROJECT_NAME:-parkyfilms}

services:
  db:
    image: postgres:16-alpine
    container_name: parkyfilms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkyfilms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: ${TZ:-America/Lima}
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - ${PGDATA_VOLUME:-pgdata}:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: parkyfilms-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # Sobrescribir conexión para usar el nombre del servicio dentro de Docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-parkyfilms}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "${BACKEND_PORT_HOST:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: parkyfilms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # NOTA: a propósito SIN env_file: el frontend solo necesita estas 2 vars
    # públicas (no secretos). Pasar secretos al contenedor web es mala práctica.
    environment:
      # El NAVEGADOR llama a esta URL, debe ser alcanzable desde tu PC
      API_URL: ${API_URL:-http://localhost:3000/api}
      APP_URL: ${APP_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT_HOST:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-parkyfilms}_${PGDATA_VOLUME:-pgdata}
