# Frontend en AKS (dev): equivale al servicio `frontend` del compose local.
# La MISMA imagen sirve para todos los envs: docker-entrypoint.sh inyecta
# API_URL y APP_URL en runtime. El CD las fija con `kubectl set env`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cine-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: cine-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: API_URL
              value: http://localhost:3000/api
            - name: APP_URL
              value: http://localhost:8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cine-dev
spec:
  # ClusterIP a propósito: sin IP pública propia. La única puerta
  # a la calle es el Ingress (1 IP). Ver k8s/ingress.yaml.
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend
