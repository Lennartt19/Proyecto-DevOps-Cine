# Postgres exporter: el TRADUCTOR de la base de datos.
#
# Idea en 30 segundos: postgres habla "SQL" y Prometheus solo entiende
# "números en /metrics". Este pod pregunta a la BD ("¿cuántas conexiones
# hay? ¿qué tamaño tienen las tablas?") y lo publica en :9187/metrics.
#
# Lo importante: es un Deployment NUEVO en `cine-dev`. El `postgres.yaml`
# de la app NO se modificó. Lee el MISMO secret `cine-secrets` que ya usan
# backend y postgres (sin secretos nuevos ni valores pegados aquí).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: cine-dev
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
              name: metrics # el nombre importa: el ServiceMonitor lo busca por este nombre
          env:
            # Las 3 vienen del secret (igual que en backend.yaml y postgres.yaml).
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cine-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cine-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cine-secrets
                  key: POSTGRES_PASSWORD
            # La 4ta las COMBINA. $(VAR) es expansión de Kubernetes:
            # se resuelve al arrancar el pod, no al aplicar el YAML.
            # postgres.cine-dev.svc... = "el service postgres del namespace cine-dev".
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.cine-dev.svc.cluster.local:5432/$(POSTGRES_DB)?sslmode=disable"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# Service interno: la "puerta con dirección fija" que Prometheus raspa.
# ClusterIP = invisible desde internet (igual que el service de postgres).
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: cine-dev
  labels:
    app: postgres-exporter
spec:
  type: ClusterIP # solo lo raspa Prometheus, sin IP pública
  ports:
    - name: metrics # mismo nombre que el containerPort de arriba
      port: 9187
      targetPort: 9187
  selector:
    app: postgres-exporter
---
# ServiceMonitor: el "permiso de raspado".
# Le dice a Prometheus: "cada 30s visita /metrics de ese Service".
# REGLA de Prometheus: el monitor solo ve Services de SU namespace,
# por eso este vive en cine-dev (donde está el exporter) y no en monitoring.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: cine-dev
spec:
  selector:
    matchLabels:
      app: postgres-exporter
  endpoints:
    - port: metrics # el nombre del puerto del Service de arriba
      path: /metrics
      interval: 30s
