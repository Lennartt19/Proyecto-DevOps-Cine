# Values DEV de Grafana (chart `grafana/grafana`, release `grafana`).
#
# Idea: Grafana = la pizarra que dibuja los números de Prometheus y los
# textos de Loki. Vive en http://<host>/grafana (MISMO host que la app).
# El usuario/clave NO van aquí (sería subir un secreto a git).
# Los crea el workflow CD en el Secret `grafana-admin` desde el
# GitHub Secret GRAFANA_ADMIN_PASSWORD. Aquí solo decimos su nombre.
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# Disco de 1Gi para dashboards y la config (si no, se pierden al reiniciar).
persistence:
  enabled: true
  size: 1Gi

# ClusterIP a propósito: la puerta pública es el Ingress existente
# (monitoring-ingress.yaml). LoadBalancer crearía otra IP pública = costo.
service:
  type: ClusterIP

# Grafana es el inquilino /grafana, no la raíz /. Sin esto, página en blanco.
grafana.ini:
  server:
    root_url: http://__INGRESS_HOST__/grafana # el CD reemplaza __INGRESS_HOST__ (igual que la app)
    serve_from_sub_path: "true"

# Las 2 fuentes pre-conectadas: Prometheus (números) y Loki (logs).
# Los uid fijos los usa el dashboard aprovisionado de abajo.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local:80
        isDefault: true
      - name: Loki
        type: loki
        uid: Loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        jsonData:
          maxLines: 1000

# Dashboard aprovisionado "Cine DEV - Navegación" (ver dashboard-navegacion.yaml).
# Grafana lee solo los JSON que estén bajo /var/lib/grafana/dashboards/cine,
# que es donde se monta el ConfigMap. Sin esto no hay ningún panel de logs.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: cine
        orgId: 1
        folder: Cine
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/cine
extraConfigmapMounts:
  - name: cine-dashboard
    mountPath: /var/lib/grafana/dashboards/cine
    configMap: grafana-dashboard-cine
    readOnly: true
