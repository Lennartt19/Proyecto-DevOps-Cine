# Dice al driver CSI qué secretos traer del Key Vault y a qué Secret de K8s copiarlos.
# Los Deployments NO cambian sus env (siguen con secretKeyRef a cine-secrets):
# solo montan este volumen para que el driver haga el sync al arrancar el pod.
# Si renombras el vault en terraform, cambia keyvaultName aquí también.
# OJO: objectName = nombre EN EL VAULT (sin '_', solo A-Z/0-9/-).
# key = nombre EN K8s (con '_' como lo esperan backend/postgres).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cine-secrets-provider
  namespace: cine-dev
spec:
  provider: azure
  parameters:
    # Usa la identidad del AKS (kubelet), que tiene "Key Vault Secrets User".
    useVMManagedIdentity: "true"
    keyvaultName: kvcinedev01
    tenantId: 717b9a79-1b91-41ab-a6f7-a579b46a9b41 # tenant UNMSM (no es secreto)
    objects: |
      array:
        - |
          objectName: POSTGRES-DB
          objectType: secret
        - |
          objectName: POSTGRES-USER
          objectType: secret
        - |
          objectName: POSTGRES-PASSWORD
          objectType: secret
        - |
          objectName: JWT-SECRET
          objectType: secret
        - |
          objectName: SESSION-SECRET
          objectType: secret
  # Copia lo traído al Secret normal de K8s (así los pods no se enteran del Vault).
  secretObjects:
    - secretName: cine-secrets
      type: Opaque
      data:
        - objectName: POSTGRES-DB
          key: POSTGRES_DB
        - objectName: POSTGRES-USER
          key: POSTGRES_USER
        - objectName: POSTGRES-PASSWORD
          key: POSTGRES_PASSWORD
        - objectName: JWT-SECRET
          key: JWT_SECRET
        - objectName: SESSION-SECRET
          key: SESSION_SECRET
