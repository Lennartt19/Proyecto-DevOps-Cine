# Postgres en clúster (dev): equivale al servicio `db` del compose local.
# El ConfigMap `postgres-init` NO vive aquí: lo crea el workflow CD desde db/init/*.sql
# (una sola fuente de verdad, evita duplicar los SQL en este repo).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: cine-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cine-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate # 1 sola réplica con PVC: no usar RollingUpdate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cine-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cine-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cine-secrets
                  key: POSTGRES_PASSWORD
            - name: TZ
              value: America/Lima
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              # Usa el usuario/BD reales del secret (igual que el healthcheck del compose).
              # Antes iba '-U postgres' fijo y fallaba si POSTGRES_USER era otro.
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cine-dev
spec:
  type: ClusterIP # solo accesible dentro del clúster (backend la usa como DB_HOST=postgres)
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
