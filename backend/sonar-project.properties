# Config del análisis SonarQube para el backend.
# Lo lee el scanner del CI (job `sonar` en ci.yml). Clave = proyecto en el
# servidor (se crea solo en el primer análisis).
sonar.projectKey=cine-backend
sonar.projectName=Cine Backend
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**
sonar.sourceEncoding=UTF-8
